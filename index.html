<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Forzar barra de herramientas del navegador en negro -->
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Delivery Beer El Punto</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 25px; /* Margen para subir los iconos y que no toquen el borde */
        }

        /* Contenedor Superior (Botón Abierto) */
        .top-bar {
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: flex-end;
            padding: 15px 20px 5px 20px;
        }

        .status-btn {
            background-color: #10b981;
            color: #ffffff;
            padding: 8px 18px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
            border: none;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(16, 185, 129, 0.4);
        }

        /* Contenedor Central */
        .container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-grow: 1;
            justify-content: center;
            padding: 10px;
        }

        /* Banner estilo tarjeta */
        .banner {
            width: 100%;
            max-width: 420px;
            background: linear-gradient(135deg, #0d1b2a, #1b263b);
            border-radius: 14px;
            padding: 22px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 6px 20px rgba(0,0,0,0.8);
            border: 1px solid #1f2937;
        }

        .banner-text h1 {
            font-size: 26px;
            font-weight: bold;
            color: #ffffff;
            font-style: italic;
            line-height: 1.1;
        }

        .banner-text p {
            font-size: 12px;
            color: #b0c4de;
            font-style: italic;
            margin-top: 6px;
        }

        .banner-text span {
            font-size: 10px;
            color: #8a9ea8;
            letter-spacing: 1px;
            display: block;
            margin-top: 6px;
        }

        .banner-icons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .icon-circle {
            width: 38px;
            height: 38px;
            border: 1px solid #d4af37;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.4);
            font-size: 16px;
        }

        /* Barra de navegación inferior flotante */
        .nav-bar {
            width: 88%;
            max-width: 380px;
            background-color: #121212;
            border: 1px solid #262626;
            border-radius: 22px;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            box-shadow: 0 8px 25px rgba(0,0,0,0.9);
            margin-bottom: 5px;
        }

        .nav-item {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 22px;
            cursor: pointer;
            padding: 8px 16px;
            border-radius: 50%;
            transition: background 0.2s;
        }

        .nav-item:active {
            background-color: #2a2a2a;
        }
    </style>
</head>
<body>

    <!-- Botón de Estado Superior -->
    <div class="top-bar">
        <button class="status-btn">Abierto</button>
    </div>

    <!-- Contenido Principal -->
    <div class="container">
        <div class="banner">
            <div class="banner-text">
                <h1>El Punto<br>delivery</h1>
                <p>Tu Tiendita de la esquina online</p>
                <span>COL. NUEVO MEXICO</span>
            </div>
            <div class="banner-icons">
                <div class="icon-circle">🏬</div>
                <div class="icon-circle">📦</div>
                <div class="icon-circle">📍</div>
            </div>
        </div>
    </div>

    <!-- Menú Inferior Flotante -->
    <div class="nav-bar">
        <button class="nav-item">💬</button>
        <button class="nav-item">📍</button>
        <button class="nav-item">🛒</button>
    </div>

</body>
</html>
