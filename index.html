<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delivery El Punto</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background: #121212; color: #fff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 15px; }
        .container { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 15px; }
        
        /* Imagen principal */
        .img-box { width: 100%; height: 220px; background: #222; border-radius: 10px; overflow: hidden; display: flex; justify-content: center; align-items: center; border: 1px solid #333; }
        .img-box img { width: 100%; height: 100%; object-fit: cover; }

        /* Botón de Estado (Cerrado/Abierto) */
        .btn-estado { padding: 12px; font-size: 16px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; text-align: center; transition: 0.2s; }
        .cerrado { background: #d9534f; color: white; }
        .abierto { background: #5cb85c; color: white; }

        /* Botones de navegación */
        .nav-btn { width: 100%; padding: 14px; background: #ff9800; color: #000; font-weight: bold; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; text-align: center; text-decoration: none; display: block; }
        .nav-btn:active { background: #e68900; }

        /* Botón WhatsApp */
        .btn-wsp { width: 100%; padding: 14px; background: #25D366; color: #fff; font-weight: bold; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; text-align: center; text-decoration: none; display: block; }

        /* Visor interno para no salir de la pantalla */
        #visor-container { display: none; width: 100%; height: 450px; background: #fff; border-radius: 10px; overflow: hidden; position: relative; margin-top: 10px; }
        #visor-container iframe { width: 100%; height: 100%; border: none; }
        .cerrar-visor { position: absolute; top: 5px; right: 5px; background: #000; color: #fff; border: none; padding: 6px 12px; border-radius: 5px; font-weight: bold; cursor: pointer; z-index: 10; }
    </style>
</head>
<body>

<div class="container">
    <h2>Delivery El Punto</h2>

    <!-- Imagen A1 (Cargada por defecto desde tu estructura o la que tenías) -->
    <div class="img-box">
        <img id="imagenA1" src="https://i.ibb.co/S7t5K5rF/26639.jpg" alt="Banner Principal">
    </div>

    <!-- Botón Estado (10 clicks para cambiar) -->
    <button id="btnEstado" class="btn-estado cerrado" onclick="clicEstado()">CERRADO (Faltan 10 clics)</button>

    <!-- Botón B1 (Cobertura) abre sin salir -->
    <button class="nav-btn" onclick="abrirVisor('https://cartelera-oaxaca.github.io/Coberturaelpunto/')">🗺️ Ver Cobertura</button>

    <!-- Botón C1 (Catálogo) abre sin salir -->
    <button class="nav-btn" onclick="abrirVisor('https://super-delivery-elpunto.netlify.app/')">📦 Ver Catálogo</button>

    <!-- Botón WhatsApp -->
    <a class="btn-wsp" href="https://wa.me/525644276032?text=Hola,%20quiero%20hacer%20un%20pedido" target="_blank">💬 Chat Directo WhatsApp</a>

    <!-- Visor interno -->
    <div id="visor-container">
        <button class="cerrar-visor" onclick="cerrarVisor()">✖ Cerrar</button>
        <iframe id="marcoVisor" src=""></iframe>
    </div>
</div>

<script>
    // Lógica de los 10 clics para cambiar Abierto/Cerrado sin bugs
    let clicks = 0;
    let estadoAbierto = false;

    function clicEstado() {
        clicks++;
        let faltan = 10 - clicks;
        let btn = document.getElementById("btnEstado");

        if (clicks >= 10) {
            estadoAbierto = !estadoAbierto;
            clicks = 0; 
            if (estadoAbierto) {
                btn.className = "btn-estado abierto";
                btn.innerText = "ABIERTO (Click 10 veces para cerrar)";
            } else {
                btn.className = "btn-estado cerrado";
                btn.innerText = "CERRADO ()";
            }
        } else {
            if (estadoAbierto) {
                btn.innerText = `ABIERTO (Faltan ${faltan} clics)`;
            } else {
                btn.innerText = `CERRADO (Faltan ${faltan} clics)`;
            }
        }
    }

    // Funciones para abrir enlaces sin salir de la pantalla en iframe
    function abrirVisor(url) {
        let visor = document.getElementById("visor-container");
        let marco = document.getElementById("marcoVisor");
        marco.src = url;
        visor.style.display = "block";
        visor.scrollIntoView({ behavior: 'smooth' });
    }

    function cerrarVisor() {
        let visor = document.getElementById("visor-container");
        let marco = document.getElementById("marcoVisor");
        marco.src = "";
        visor.style.display = "none";
    }
</script>

</body>
</html>
