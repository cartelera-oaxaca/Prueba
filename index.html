<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visor - Caché Forzado</title>
<style>
  body,html{margin:0;padding:0;height:100%;overflow:hidden;font-family:sans-serif;background:#000}
  #mainFrame{width:100%;height:100%;border:0;position:absolute;top:0;left:0;z-index:1}
  #controles{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:999;display:flex;gap:10px;background:rgba(0,0,0,.7);padding:10px 15px;border-radius:50px;backdrop-filter:blur(10px)}
 .btn{padding:12px 20px;border-radius:30px;border:0;font-weight:700;color:#fff;cursor:pointer;text-decoration:none;display:inline-block}
  #btnCobertura{background:#007bff} #btnCatalogo{background:#28a745} #btnChat{background:#25D366}
  #btnEstado{background:#dc3545;min-width:110px}
  #modal{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:1000;display:none;flex-direction:column}
  #modalHead{color:#fff;padding:10px;display:flex;justify-content:space-between;align-items:center}
  #modalFrame{flex:1;border:0;background:#fff;border-radius:12px 12px 0 0}
</style>
</head>
<body>

<iframe id="mainFrame" allow="fullscreen"></iframe>

<div id="controles">
  <button class="btn" id="btnCobertura">COBERTURA</button>
  <button class="btn" id="btnCatalogo">CATÁLOGO</button>
  <button class="btn" id="btnChat">CHAT</button>
  <button class="btn" id="btnEstado">CERRADO</button>
</div>

<div id="modal">
  <div id="modalHead"><span id="modalTitle">Cargando...</span><button onclick="cerrarModal()" style="font-size:22px;background:none;border:0;color:#fff;cursor:pointer">✕</button></div>
  <iframe id="modalFrame"></iframe>
</div>

<script>
const SHEET_ID = "1jKBbG2iZnStiUusvQsMZ0W11BPpwDWQpHzqztABdY9Y";
const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&t=${Date.now()}`;

let clickContador = 0;
let estadoActual = localStorage.getItem('estadoNegocio') || 'CERRADO';

function actualizarBotonEstado(){
  const b = document.getElementById('btnEstado');
  b.textContent = estadoActual;
  b.style.background = estadoActual === 'ABIERTO'? '#28a745' : '#dc3545';
}
actualizarBotonEstado();

document.getElementById('btnEstado').addEventListener('click', ()=>{
  clickContador++;
  if(clickContador >= 10){
    estadoActual = estadoActual === 'CERRADO'? 'ABIERTO' : 'CERRADO';
    localStorage.setItem('estadoNegocio', estadoActual);
    actualizarBotonEstado();
    clickContador = 0;
    alert('Estado cambiado a: ' + estadoActual);
  }
  setTimeout(()=>{ if(clickContador>0) clickContador=0; }, 3000);
});

function abrirModal(url, titulo){
  document.getElementById('modalTitle').textContent = titulo;
  document.getElementById('modalFrame').src = url + (url.includes('?')?'&':'?') + 'v='+Date.now();
  document.getElementById('modal').style.display = 'flex';
}
function cerrarModal(){
  document.getElementById('modal').style.display = 'none';
  document.getElementById('modalFrame').src = 'about:blank';
}

async function cargarSheet(){
  try{
    const res = await fetch(SHEET_URL, {cache: "no-store"});
    const txt = await res.text();
    const json = JSON.parse(txt.substr(47).slice(0,-2));
    const row = json.table.rows[0].c; // Fila 1 = A1, B1, C1, D1
    const A1 = row[0]?.v || '';
    const B1 = row[1]?.v || '';
    const C1 = row[2]?.v || '';
    const D1 = row[3]?.v || '';

    // A1 - Pagina completa de fondo
    if(A1){
      document.getElementById('mainFrame').src = A1 + (A1.includes('?')?'&':'?') + 'nocache='+Date.now();
      // Reflejar como meta para SEO
      let m = document.createElement('meta'); m.setAttribute('property','og:url'); m.content=A1; document.head.appendChild(m);
    }

    document.getElementById('btnCobertura').onclick = () => B1? abrirModal(B1, 'Cobertura') : alert('Sin URL en B1');
    document.getElementById('btnCatalogo').onclick = () => C1? abrirModal(C1, 'Catálogo') : alert('Sin URL en C1');
    document.getElementById('btnChat').onclick = () => D1? abrirModal(D1, 'Chat Directo') : alert('Sin URL en D1');

  }catch(e){
    console.error(e);
    alert('Error: Tu Sheet no está en público. Hazlo público como te dije arriba. Detalle: ' + e.message);
  }
}

// Fuerza recarga dura al inicio
if(performance.navigation.type === 1){} // recarga normal
cargarSheet();
</script>
</body>
</html>
