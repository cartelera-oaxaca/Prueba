<!-- Creado para El Punto Delivery - Privado y Protegido -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tienda Express 20 Min</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}
body{background:#121212;color:#fff}
.top{position:sticky;top:0;z-index:999;background:#111;color:#fff;display:flex;justify-content:space-between;padding:10px;border-bottom:1px solid #222}
.btnO{border:none;border-radius:20px;padding:7px 16px;font-weight:900;cursor:pointer}
.open{background:#00c853;color:#fff}.closed{background:#d50000;color:#fff}
.cartBtn{background:#fff;border:none;border-radius:20px;padding:8px 14px;font-weight:900;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:10px}
.card{background:#1e1e1e;border:1px solid #2c2c2c;border-radius:14px;padding:10px;box-shadow:0 2px 8px #0004;display:flex;flex-direction:column;align-items:center}
.card img{width:100%;height:160px;object-fit:cover;border-radius:8px}
.antes{text-decoration:line-through;color:#aaa;font-size:13px}
.ahora{color:#ff5252;font-weight:900;font-size:18px}
#map{height:300px;border-radius:12px;margin-top:8px;border:1px solid #333}
#cartModal{position:fixed;inset:0;background:#000b;display:none;z-index:9999}
#cartModal.show{display:block}
.panel{background:#181818;color:#fff;max-width:420px;height:100%;margin-left:auto;display:flex;flex-direction:column;box-shadow:-4px 0 20px rgba(0,0,0,0.8)}
.qty-btn{background:#333;color:#fff;border:none;width:28px;height:28px;font-weight:bold;border-radius:4px;cursor:pointer}
</style>
</head>
<body>
<div class="top">
<button id="openBtn" class="btnO open" onclick="toggle()">ABIERTO</button>
<button class="cartBtn" onclick="openCart()">🛒 <span id="tot">$0</span> (<span id="cnt">0</span>)</button>
</div>
<div id="bR" style="background:#e30613;color:#fff;text-align:center;padding:8px;font-weight:800;display:none"></div>
<div id="lg" style="text-align:center;background:#181818;padding:10px;display:none"></div>
<div id="bA" style="background:#ffeb3b;color:#000;text-align:center;padding:8px;display:none"></div>
<div style="display:flex;gap:10px;padding:10px;background:#121212">
<a id="aCob" href="https://cartelera-oaxaca.github.io/Coberturaelpunto/" target="_blank" style="flex:1;background:#1e1e1e;border:1px solid #333;color:#fff;padding:10px;border-radius:10px;text-align:center;text-decoration:none">📍 Cobertura</a>
<a id="aAyu" href="#" style="flex:1;background:#25D366;color:#fff;padding:10px;border-radius:10px;text-align:center;text-decoration:none;display:none">💬 Ayuda</a>
</div>
<div id="grid" class="grid"></div>
<div id="esp"></div>
<div id="sobre"></div>

<div id="cartModal" onclick="if(event.target==this)this.classList.remove('show')">
<div class="panel">
<div style="display:flex;justify-content:space-between;align-items:center;padding:14px;font-weight:900;border-bottom:1px solid #2c2c2c">
  <span>Tu pedido - 20 min max</span>
  <button onclick="document.getElementById('cartModal').classList.remove('show')" style="background:none;border:none;color:#fff;font-weight:bold;cursor:pointer;font-size:18px">X</button>
</div>
<div id="items" style="flex:1;overflow:auto;padding:10px"></div>
<div style="padding:12px;border-top:1px solid #2c2c2c;background:#121212">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
  <b style="font-size:12px;color:#ddd">Selecciona entrega dentro del área azul</b>
  <a href="https://cartelera-oaxaca.github.io/Coberturaelpunto/" target="_blank" style="font-size:11px;color:#00c853;text-decoration:none;font-weight:bold">Ver Mapa Cobertura ↗</a>
</div>
<div id="map"></div>
<p id="msg" style="color:#ff5252;font-size:12px;margin-top:6px;font-weight:bold"></p>
<div style="display:flex;justify-content:space-between;font-weight:900;margin-top:10px;font-size:16px"><span>Total</span><span id="tot2">$0</span></div>
<button onclick="enviar()" style="width:100%;background:#00c853;color:#fff;border:none;padding:12px;border-radius:10px;font-weight:900;margin-top:8px;cursor:pointer">Confirmar WhatsApp</button>
</div>
</div>
</div>

<script>
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/1w2lH13Ql9poP-J2nuYJzoJmMyeUAdHladPAIEn2joJc/export?format=csv";

// Coordenadas exactas del polígono de cobertura provistas
const polygonCoords = [
  [17.067589540518618, -96.74071311950684],
  [17.105839557963257, -96.76165580749512],
  [17.10042200306545, -96.77229881286623],
  [17.06535457451177, -96.75159931270174]
];

let prods=[], cart=JSON.parse(localStorage.getItem('cart')||'[]'), abierto=localStorage.getItem('ab')!=='0', map,marker,polygonLayer,punto=null;

function parseB(s){ 
  if(!s) return null; 
  s=s.toString().trim().replace(/"/g,''); 
  let m=s.match(/https?:\/\/[^\s]+/); 
  if(!m) return null; 
  let url=m[0]; 
  let r=s.replace(url,'').trim().split(/\s+/).filter(Boolean); 
  let an=null,ah=null; 
  if(r.length>=2){an=parseFloat(r[0]);ah=parseFloat(r[1]);} 
  else if(r.length==1){ah=parseFloat(r[0]);} 
  return {img:url,antes:an,ahora:ah}; 
}

function renderCara(rows){
  let get=(i)=>rows[i]?.[0]?.replace(/"/g,'').trim()||"";
  let br=document.getElementById('bR'), v=get(1); 
  if(!v){br.style.display='none'} else {br.style.display='block'; br.innerHTML=v.includes('http')?`<img src="${v}" style="width:100%;max-height:90px;object-fit:contain">`:v}
  
  let lg=document.getElementById('lg'); v=get(2); 
  if(!v||!v.includes('http')){lg.style.display='none'} else {lg.style.display='block'; lg.innerHTML=`<img src="${v}" style="max-height:70px;object-fit:contain">`}
  
  let ba=document.getElementById('bA'); v=get(3); 
  if(!v){ba.style.display='none'} else {ba.style.display='block'; ba.innerHTML=v.includes('http')?`<img src="${v}" style="width:100%;max-height:150px;object-fit:contain">`:v}
  
  let ay=document.getElementById('aAyu'); v=get(5); 
  if(!v||!v.includes('http')){ay.style.display='none'} else {ay.style.display='block'; ay.href=v}
  
  let es=document.getElementById('esp'); v=get(6); 
  es.innerHTML=(v&&v.includes('http'))?`<img src="${v}" style="width:100%">`:''
  
  let so=document.getElementById('sobre'); v=get(7); 
  so.innerHTML=(v&&v.includes('http'))?`<img src="${v}" style="width:100%">`:''
}

function renderGrid(){ 
  let g=document.getElementById('grid'); 
  g.innerHTML=''; 
  prods.forEach((p,i)=>{ 
    g.innerHTML+=`<div class="card" onclick="if(prods[${i}].link)window.open(prods[${i}].link)">
      <img src="${p.img}" loading="lazy">
      <div style="text-align:center;margin-top:6px">${p.antes?`<span class="antes">$${p.antes}</span> `:''}<span class="ahora">$${p.ahora||p.antes||''}</span></div>
      <button onclick="event.stopPropagation();add(${i})" style="width:100%;background:#fff;color:#000;border:none;padding:8px;border-radius:8px;margin-top:6px;cursor:pointer;font-weight:bold">Agregar</button>
    </div>`; 
  });
}

function toggle(){ abierto=!abierto; localStorage.setItem('ab',abierto?'1':'0'); updOpen(); }
function updOpen(){ let b=document.getElementById('openBtn'); b.textContent=abierto?'ABIERTO':'CERRADO'; b.className='btnO '+(abierto?'open':'closed'); }

function add(i){ 
  let p=prods[i]; 
  let f=cart.find(x=>x.img==p.img); 
  if(f) f.cant++; 
  else cart.push({...p,cant:1}); 
  save(); 
}

function changeQty(i, delta){
  cart[i].cant += delta;
  if(cart[i].cant <= 0) {
    cart.splice(i,1);
  }
  save();
}

function save(){ localStorage.setItem('cart',JSON.stringify(cart)); updCart(); }

function updCart(){ 
  let t=0,c=0; 
  cart.forEach(x=>{t+=(x.ahora||x.antes||0)*x.cant; c+=x.cant;}); 
  document.getElementById('tot').textContent='$'+t; 
  document.getElementById('tot2').textContent='$'+t; 
  document.getElementById('cnt').textContent=c; 
  let d=document.getElementById('items'); 
  d.innerHTML=''; 
  cart.forEach((x,i)=>{ 
    d.innerHTML+=`<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;border-bottom:1px solid #2c2c2c;padding-bottom:8px">
      <img src="${x.img}" style="width:50px;height:50px;object-fit:cover;border-radius:6px">
      <div style="flex:1">
        <div style="font-weight:bold;color:#fff">$${x.ahora||x.antes}</div>
        <div style="display:flex;align-items:center;gap:6px;margin-top:4px">
          <button class="qty-btn" onclick="changeQty(${i}, -1)">-</button>
          <span style="color:#fff">${x.cant}</span>
          <button class="qty-btn" onclick="changeQty(${i}, 1)">+</button>
        </div>
      </div>
      <button onclick="cart.splice(${i},1);save()" style="background:#d50000;color:#fff;border:none;padding:4px 8px;border-radius:4px;cursor:pointer">X</button>
    </div>`; 
  }); 
}

function openCart(){ 
  document.getElementById('cartModal').classList.add('show'); 
  setTimeout(()=>{ initMap(); }, 200); 
}

// Función matemática para verificar si un punto (lat, lng) está dentro de un polígono
function isPointInPolygon(point, vs) {
  let x = point.lat, y = point.lng;
  let inside = false;
  for (let i = 0, j = vs.length - 1; i < vs.length; j = i++) {
    let xi = vs[i][0], yi = vs[i][1];
    let xj = vs[j][0], yj = vs[j][1];
    let intersect = ((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi);
    if (intersect) inside = !inside;
  }
  return inside;
}

function initMap(){ 
  if(!map){
    map = L.map('map').setView([17.085, -96.755], 13.5); 
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map); 
    
    // Dibujar el polígono exacto de cobertura en el mapa
    polygonLayer = L.polygon(polygonCoords, {color: '#1e88e5', fillColor: '#1e88e5', fillOpacity: 0.3}).addTo(map);
    
    map.on('click', e => { 
      if (!isPointInPolygon(e.latlng, polygonCoords)) {
        document.getElementById('msg').textContent='❌ Fuera de cobertura. Elige dentro del área azul.';
        punto = null;
        if(marker) map.removeLayer(marker);
        return;
      } 
      document.getElementById('msg').textContent=''; 
      punto = e.latlng; 
      if(marker) map.removeLayer(marker); 
      marker = L.marker(e.latlng).addTo(map); 
    });
  } else {
    map.invalidateSize();
    map.fitBounds(polygonLayer.getBounds());
  }
}

function enviar(){ 
  if(!abierto){alert('Lo sentimos, estamos CERRADOS.');return;}
  if(cart.length === 0){alert('Tu carrito está vacío.');return;}
  if(!punto){
    document.getElementById('msg').textContent='⚠️ Debes marcar tu ubicación en el mapa.';
    return;
  }
  if(!isPointInPolygon(punto, polygonCoords)){
    document.getElementById('msg').textContent='❌ Tu ubicación está fuera de la zona de cobertura.';
    return;
  }
  
  let txt='PEDIDO:%0A'; 
  cart.forEach(x=>txt+=`${x.img} $${x.ahora||x.antes} x${x.cant}%0A`); 
  txt+=`TOTAL ${document.getElementById('tot2').textContent}%0A`;
  txt+=`MAPA: https://www.google.com/maps?q=${punto.lat},${punto.lng}%0A`;
  window.open(`https://wa.me/5215644276032?text=${txt}`,'_blank'); 
}

async function cargar(){ 
  let r=await fetch(SHEET_CSV_URL); 
  let t=await r.text(); 
  let rows=t.split('\n').map(x=>x.split(',')); 
  prods=[]; 
  for(let i=1;i<rows.length;i++){ 
    let b=rows[i][1]?.replace(/"/g,'').trim()||""; 
    if(!b) continue; 
    let p=parseB(b); 
    if(!p) continue; 
    let link=(rows[i][2]||rows[i][3]||"").replace(/"/g,'').trim(); 
    if(link.includes('http')) p.link=link; 
    prods.push(p);
  } 
  renderCara(rows); 
  renderGrid(); 
  updOpen(); 
  updCart(); 
}

cargar();
</script>
</body>
</html>
