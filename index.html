<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1, viewport-fit=cover">
<title>99 | Cartelera Oaxaca HD</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@800;900&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#09090b;--card:#18181b;--border:#27272a;--accent:#f43f5e}
*{margin:0;padding:0;box-sizing:border-box}
html{background:var(--bg);height:100%}
body{background:var(--bg);color:#fff;font-family:'Plus Jakarta Sans',sans-serif; min-height:100vh; min-height:100dvh; width:100%; overflow-x:hidden}

/* TITULO PRO - NO DEPENDE DEL SHEET */
#txt-titulo{
  font-family:'Outfit', sans-serif!important;
  font-weight:900!important;
  text-align:center;
  margin:20px auto 14px;
  font-size:clamp(28px, 7vw, 42px);
  line-height:0.9;
  letter-spacing:-1.5px;
  text-transform:uppercase;
  max-width:90vw;
  text-shadow: 0 0 20px rgba(244,63,94,.4);
}
#txt-titulo span{
  background: linear-gradient(90deg, #f43f5e, #fbbf24);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
}

.header{padding:12px;text-align:center;position:sticky;top:0;z-index:10;background:rgba(9,9,11,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.banner-rojo{background:#f43f5e;color:#fff;text-align:center;padding:11px;font-weight:800;font-size:12px;display:none}
#banner-intermedio{width:min(900px,92vw);margin:10px auto;display:none;text-align:center;font-weight:800;font-size:13px;color:#fb7185;background:rgba(244,63,94,.1);border:1px dashed var(--accent);padding:10px;border-radius:12px}
#espectacular{width:min(1200px,94vw);margin:10px auto;display:none;border-radius:20px;padding:3px;background:linear-gradient(90deg,#f43f5e,#fbbf24,#f43f5e)}
#espectacular>div{background:#000;border-radius:16px;overflow:hidden;aspect-ratio:16/6}
#espectacular img{width:100%;height:100%;object-fit:cover}
#btnCobertura{width:min(900px,92vw);margin:10px auto;display:none;text-align:center}
#btnCobertura a{background:#fff;color:#000;padding:13px 24px;border-radius:999px;font-weight:900;text-decoration:none;display:inline-block}
.grid{width:min(1200px,94vw);margin:10px auto;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding-bottom:90px}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}@media(min-width:1024px){.grid{grid-template-columns:repeat(5,1fr)}}
.cuadro{aspect-ratio:1;border-radius:18px;background:var(--card);border:1px solid var(--border);position:relative;overflow:hidden;cursor:pointer}
.cuadro img.logo{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;top:19px;height:calc(100% - 19px)}
.nombre-icono{position:absolute;top:0;left:0;right:0;height:19px;background:var(--accent);color:#fff;font-size:8px;font-weight:900;text-align:center;line-height:19px;z-index:3;overflow:hidden;white-space:nowrap}
.n{position:absolute;top:22px;left:5px;font-size:8px;font-weight:800;background:rgba(0,0,0,.7);padding:3px 6px;border-radius:999px;z-index:4}
.libre-center{position:absolute;inset:0;top:19px;display:flex;align-items:center;justify-content:center;font-weight:900;color:#71717a}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;z-index:9999;padding:10px}
#box{background:var(--card);border:1px solid var(--border);border-radius:22px;max-width:520px;width:100%;max-height:92vh;overflow-y:auto}
.btn{width:100%;padding:13px;border-radius:14px;border:none;font-weight:800;margin-top:8px;cursor:pointer;text-decoration:none;display:flex;justify-content:center}
.btn-rojo{background:var(--accent);color:#fff}.btn-gris{background:#27272a;color:#fff}
.like-bar{display:flex;gap:8px;margin:10px 0}
.like-btn{flex:1;padding:10px;border-radius:999px;border:1px solid var(--border);background:#27272a;color:#fff;font-weight:800;font-size:12px;cursor:pointer}
.like-btn.activo{background:#f43f5e}
.coment-box{background:#09090b;border:1px solid var(--border);border-radius:12px;padding:8px;margin-top:8px}
.coment-input{width:100%;background:transparent;border:none;color:#fff;outline:none;font-size:13px}

/* BOTON AYUDA FIX ZOOM */
#btnAyuda{position:fixed;bottom:18px;right:18px;z-index:9000;background:#fff;color:#000;border:0;border-radius:999px;padding:14px 18px;font-weight:900;box-shadow:0 8px 30px rgba(0,0,0,.5);cursor:pointer;display:none}
#modalAyuda{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;flex-direction:column;z-index:100000;padding:12px;overflow:hidden}
#modalAyuda.activo{display:flex}
#visorAyudaWrap{flex:1;width:100%;background:#fff;border-radius:16px;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center}
#visorAyuda{width:100%;height:100%;border:0;display:block}
#visorAyuda.img-mode{object-fit:contain;max-width:100%;max-height:100%;width:auto;height:auto}
</style>
</head>
<body>
<div class="header"><h2 style="font-family:Outfit;font-weight:900;letter-spacing:1px">CARTELERA DIGITAL • OAXACA</h2></div>
<div class="banner-rojo" id="txt-baner2"></div>
<h1 id="txt-titulo">Directorio <span>Negocios</span></h1>
<div id="banner-intermedio"></div>
<div id="espectacular"><div id="espCont"></div></div>
<div id="btnCobertura"><a id="linkCobertura" target="_blank">📍 VER COBERTURA 8KM</a></div>
<div class="grid" id="grid">Cargando HD...</div>
<div id="modal"><div id="box"></div></div>

<!-- AYUDA G12 FIX -->
<button id="btnAyuda">❓ AYUDA</button>
<div id="modalAyuda">
  <div style="display:flex;gap:8px;margin-bottom:10px">
    <button onclick="cerrarAyuda()" style="flex:1;background:#27272a;color:#fff;border:1px solid #3f3f46;padding:12px;border-radius:12px;font-weight:900">✕ CERRAR AYUDA</button>
    <a id="abrirFuera" target="_blank" style="flex:1;background:#fff;color:#000;padding:12px;border-radius:12px;font-weight:900;text-align:center;text-decoration:none;display:none">Abrir fuera ↗</a>
  </div>
  <div id="visorAyudaWrap">
    <iframe id="visorAyuda" src="" style="display:none"></iframe>
    <img id="visorImg" src="" style="display:none;max-width:100%;max-height:100%;object-fit:contain;border-radius:16px">
  </div>
</div>

<script>
const SHEET_URL="https://docs.google.com/spreadsheets/d/1qoDyTeMp6Ex_Nbx-QG4fn1nq7g_4jtaDSkAQn1Dpv84/gviz/tq?tqx=out:csv";
const WA_BASE="5215644276032";
const isUrl=s=>{try{if(!s) return false;const u=new URL(String(s).trim());return u.protocol.startsWith('http')&&String(s).length>8}catch{return false}};
const isShow=v=>{const t=String(v||'').trim();if(!t) return false;if(t.toLowerCase()==='false'||t.toLowerCase()==='0'||t.toLowerCase()==='null') return false;return true;}
function toHD(u){if(!u) return ''; let s=String(u).trim(); if(s.includes('drive.google.com')){const m=s.match(/\/d\/([a-zA-Z0-9_-]+)/)||s.match(/id=([a-zA-Z0-9_-]+)/); if(m) return `https://drive.google.com/uc?export=view&id=${m[1]}`;} return s;}
function parseCSV(t){const rows=[];let r=[],c='',q=false;for(let i=0;i<t.length;i++){const ch=t[i],nx=t[i+1];if(ch=='"'){if(q&&nx=='"'){c+='"';i++;}else q=!q;}else if(ch==','&&!q){r.push(c.trim());c='';}else if((ch=='\n'||ch=='\r')&&!q){if(c||r.length){r.push(c.trim());rows.push(r);r=[];c='';}if(ch=='\r'&&nx=='\n')i++;}else c+=ch;}if(c||r.length){r.push(c.trim());rows.push(r);}return rows.filter(x=>x.some(v=>v));}
let TODOS=[]; let HELP_URL="";
async function cargar(){
 const res=await fetch(SHEET_URL+'&cb='+Date.now(),{cache:'no-store'});const txt=await res.text();const all=parseCSV(txt);
 const G2=(all[1]?.[6]||'').trim(), G3=(all[2]?.[6]||'').trim(), G4=(all[3]?.[6]||'').trim(), G6=(all[5]?.[6]||'').trim(), G7=(all[6]?.[6]||'').trim();
 const G12=(all[11]?.[6]||'').trim();

 if(isShow(G2)){const b=document.getElementById('txt-baner2');b.textContent=G2;b.style.display='block';}
 // TITULO PRO: aunque escribas feo en sheet, sale pro
 if(isShow(G3)){
   const clean = G3.replace(/<[^>]*>/g,'').trim();
   document.getElementById('txt-titulo').innerHTML = clean.includes(' ')? clean.split(' ').slice(0,-1).join(' ') + ' <span>'+ clean.split(' ').slice(-1) +'</span>' : clean + ' <span></span>';
 }
 if(isShow(G4)){const b=document.getElementById('banner-intermedio');b.textContent=G4;b.style.display='block';}
 if(isUrl(G6)){document.getElementById('btnCobertura').style.display='block';document.getElementById('linkCobertura').href=G6;}
 else if(isShow(G6)&&G6.toLowerCase().includes('true')){document.getElementById('btnCobertura').style.display='block';document.getElementById('linkCobertura').href='https://coberturaoaxacacartelera.netlify.app/';}
 if(isShow(G7)&&isUrl(toHD(G7))){
  const esp=document.getElementById('espectacular');const cont=document.getElementById('espCont');esp.style.display='block';
  cont.innerHTML=`<img src="${toHD(G7)}" loading="eager">`;
 }
 if(isUrl(G12)){
   HELP_URL = toHD(G12);
   document.getElementById('btnAyuda').style.display='block';
   document.getElementById('abrirFuera').href = G12;
   document.getElementById('abrirFuera').style.display='block';
 }
 for(const cols of all.slice(1)){
  const n=parseInt(cols[0]);if(isNaN(n))continue;
  const B=cols[1]?.trim(),C=cols[2]?.trim(),D=cols[3]?.trim(),E=cols[4]?.trim(),F=cols[5]?.trim();
  const J=cols[9]?.trim(),K=cols[10]?.trim(),L=cols[11]?.trim(),M=cols[12]?.trim(),N=cols[13]?.trim(),O=cols[14]?.trim(),P=cols[15]?.trim();
  if(!B&&!C)continue;
  TODOS.push({n,logo:toHD(B),clickImg:toHD(C),dir:D,wa:E,titulo:F||'SOCIO',banJ:isUrl(toHD(J))?toHD(J):'',banK:isUrl(toHD(K))?toHD(K):'',ubi:L,banM:isUrl(toHD(M))?toHD(M):'',cat:N||'',cupon:O,lugarTxt:P});
 }
 pintar(TODOS);
}
function pintar(lista){
 const grid=document.getElementById('grid');grid.innerHTML='';const frag=document.createDocumentFragment();
 for(let i=1;i<=99;i++){
  const inf=lista.find(x=>x.n===i);const div=document.createElement('div');div.className='cuadro';
  if(inf){div.innerHTML=`<div class="nombre-icono">${inf.titulo.slice(0,20).toUpperCase()}</div><div class="n">#${String(i).padStart(3,'0')}</div><img class="logo" src="${inf.logo}" loading="${i<12?'eager':'lazy'}" decoding="async">`;}
  else{div.innerHTML=`<div class="nombre-icono" style="background:#27272a">LIBRE</div><div class="n">#${String(i).padStart(3,'0')}</div><div class="libre-center">💎 LIBRE</div>`;}
  div.onclick=()=>abrirModal(i,inf);frag.appendChild(div);
 }
 grid.appendChild(frag);
}
function getLikes(n){return JSON.parse(localStorage.getItem('likes_'+n)||'{"like":0,"encanta":0,"my":null}');}
function setLike(n,tipo){
 let d=getLikes(n); if(d.my===tipo){d[tipo]--;d.my=null;}else{if(d.my){d[d.my]--;}d[tipo]++;d.my=tipo;} localStorage.setItem('likes_'+n,JSON.stringify(d)); abrirModal(n,TODOS.find(x=>x.n===n));
}
function addComent(n){
 const input=document.getElementById('cInput');const txt=input.value.trim();if(!txt)return;
 let com=JSON.parse(localStorage.getItem('com_'+n)||'[]');com.push({t:txt, f:new Date().toLocaleDateString()});localStorage.setItem('com_'+n,JSON.stringify(com));abrirModal(n,TODOS.find(x=>x.n===n));
}
function abrirModal(num,inf){
 const box=document.getElementById('box');const modal=document.getElementById('modal');
 if(!inf){box.innerHTML=`<div style="padding:22px;text-align:center"><h2>#${num} LIBRE</h2><a class="btn btn-rojo" href="https://wa.me/${WA_BASE}?text=Quiero%20cuadro%20${num}" target="_blank">RESERVAR</a><button class="btn btn-gris" onclick="modal.style.display='none'">Cerrar</button></div>`;modal.style.display='flex';return;}
 const likes=getLikes(num); const coments=JSON.parse(localStorage.getItem('com_'+num)||'[]');
 box.innerHTML=`<div style="padding:12px;text-align:center">
  ${inf.banJ?`<img src="${inf.banJ}" style="width:100%;height:70px;object-fit:cover;border-radius:12px;margin-bottom:6px">`:''}
  ${inf.banK?`<img src="${inf.banK}" style="width:100%;height:70px;object-fit:cover;border-radius:12px;margin-bottom:6px">`:''}
  <div style="display:flex;gap:6px;justify-content:center;margin:6px 0">${inf.lugarTxt?`<span style="background:#18181b;border:1px solid #27272a;padding:5px 10px;border-radius:999px;font-size:11px">📍 ${inf.lugarTxt}</span>`:''}${inf.cat?`<span style="background:#f43f5e;padding:5px 10px;border-radius:999px;font-size:11px;font-weight:800">🏷️ ${inf.cat}</span>`:''}</div>
  ${inf.clickImg?`<img src="${inf.clickImg}" style="width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:18px">`:''}
  <h3 style="margin:10px 0">${inf.titulo}</h3>
  <div class="like-bar">
   <button class="like-btn ${likes.my==='like'?'activo':''}" onclick="setLike(${num},'like')">👍 Me gusta ${likes.like||''}</button>
   <button class="like-btn ${likes.my==='encanta'?'activo':''}" onclick="setLike(${num},'encanta')">❤️ Encanta ${likes.encanta||''}</button>
  </div>
  ${inf.banM?`<img src="${inf.banM}" style="width:100%;height:80px;object-fit:cover;border-radius:12px;margin:8px 0">`:''}
  ${inf.cupon?`<div style="border:1px dashed #f43f5e;padding:10px;border-radius:12px;background:rgba(244,63,94,.1);font-weight:800;font-size:13px">🎟️ ${inf.cupon}</div>`:''}
  ${inf.dir?`<a class="btn btn-rojo" href="${inf.dir}" target="_blank">IR AL NEGOCIO</a>`:''}
  ${inf.wa?`<a class="btn" style="background:#22c55e;color:#fff" href="https://wa.me/52${inf.wa.replace(/[^0-9]/g,'').slice(-10)}" target="_blank">WhatsApp Directo</a>`:''}
  ${inf.ubi?`<a class="btn" style="background:#0ea5e9;color:#fff" href="${inf.ubi}" target="_blank">📍 Ubicación</a>`:''}
  <div style="text-align:left;margin-top:14px"><b style="font-size:13px">💬 Comentarios (${coments.length})</b>
   ${coments.map(c=>`<div style="background:#09090b;border:1px solid #27272a;padding:8px;border-radius:10px;margin-top:6px;font-size:12px"><b>Cliente:</b> ${c.t}<br><span style="font-size:10px;color:#71717a">${c.f}</span></div>`).join('')}
   <div class="coment-box"><input id="cInput" class="coment-input" placeholder="Escribe un comentario bueno..."><button onclick="addComent(${num})" style="margin-top:6px;background:#f43f5e;color:#fff;border:none;padding:6px 12px;border-radius:999px;font-weight:800;font-size:11px">Publicar</button></div>
  </div>
  <button class="btn btn-gris" onclick="document.getElementById('modal').style.display='none'">Cerrar</button>
 </div>`;
 modal.style.display='flex';
}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')e.currentTarget.style.display='none';});

function abrirAyuda(){
 if(!HELP_URL) return;
 const ext = HELP_URL.split('.').pop().toLowerCase();
 const isImg = ['jpg','jpeg','png','webp','gif'].some(x=>HELP_URL.toLowerCase().includes(x)) || HELP_URL.includes('uc?export=view');
 const iframe = document.getElementById('visorAyuda');
 const img = document.getElementById('visorImg');
 document.body.style.overflow='hidden';
 document.getElementById('modalAyuda').classList.add('activo');
 if(isImg){
   iframe.style.display='none';
   img.style.display='block';
   img.src = HELP_URL;
 }else{
   img.style.display='none';
   iframe.style.display='block';
   iframe.src = HELP_URL;
 }
}
function cerrarAyuda(){
 document.getElementById('modalAyuda').classList.remove('activo');
 document.body.style.overflow='';
 setTimeout(()=>{
   document.getElementById('visorAyuda').src="";
   document.getElementById('visorImg').src="";
 },300);
}
document.getElementById('btnAyuda').onclick = abrirAyuda;
document.getElementById('modalAyuda').addEventListener('click',e=>{ if(e.target.id==='modalAyuda') cerrarAyuda(); });

cargar();
</script>
</body>
</html>
